<style>
:root{
    --bg:#0b0d10; --card:#0f1114;
    --accent:#00d6ff; --accent-2:#ff3b3b;
    --muted:#96a0ab; --glass: rgba(255,255,255,0.03);
    --radius:16px;
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;
    color:#e6f7fb;background:var(--bg);
}

/* === LOGO UPDATED === */
.logo{
    width:55px;
    height:auto;
    border-radius:10px;
    margin-right:4px;
    filter:drop-shadow(0 0 8px rgba(0,214,255,0.25));
}

header{
    position:fixed;left:0;right:0;top:0;
    backdrop-filter:blur(6px);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    border-bottom:1px solid rgba(255,255,255,0.03);
    z-index:40
}

.nav{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px}
.brand{display:flex;align-items:center;gap:12px}
nav a{color:var(--muted);text-decoration:none;margin:0 12px;font-weight:600}
nav a:hover{color:var(--accent)}

main{max-width:1100px;margin:120px auto 80px;padding:28px}

/* HERO */
.hero{display:grid;grid-template-columns:1fr 420px;gap:28px;align-items:center}
.hero-card{background:var(--card);padding:36px;border-radius:20px;}
.eyebrow{color:var(--accent);font-weight:700;letter-spacing:1px}
h1{margin:12px 0 8px;font-size:32px;line-height:1.05}
p.lead{color:var(--muted);margin:0 0 18px}
.cta{display:flex;gap:12px}
.btn{padding:12px 16px;border-radius:12px;background:var(--accent);cursor:pointer;color:#031018;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(0,214,255,0.4)}

.panel{background:var(--glass);padding:18px;border-radius:14px;}
.map{height:320px;background:rgba(0,0,0,0.2);border-radius:10px;}

section{margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{background:var(--glass);padding:18px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
h3{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}

/* CONTACT */
.contact-row{display:flex;gap:16px;align-items:center}
.icon-btn{width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;cursor:pointer}
.contact-reveal{background:rgba(0,0,0,0.5);padding:12px;border-radius:10px;color:var(--accent);margin-left:10px}

footer{text-align:center;color:var(--muted);padding:40px 0}

/* Responsive fix */
@media (max-width:920px){
    .hero{grid-template-columns:1fr;}
    .panel{order:2}
    .map{height:240px}
}
</style>
</head>
